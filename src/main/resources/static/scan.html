<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validar Acceso — Club Pileta QR</title>
  <script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');})()</script>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
  <style>
    .scan-grid {
      display: grid; gap: 20px;
    }
    @media (min-width: 900px) {
      .scan-grid { grid-template-columns: 460px 1fr; }
    }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab {
      flex: 1; padding: 10px; border-radius: var(--r); cursor: pointer; font-size: 14px;
      font-weight: 600; border: 1px solid var(--border); background: rgba(255,255,255,.04);
      color: var(--txt-muted); transition: .15s; text-align: center; user-select: none;
    }
    .tab.active { background: var(--accent-dim); border-color: var(--accent-ring); color: var(--accent-txt); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Camera area */
    #reader {
      width: 100%; min-height: 260px; border-radius: var(--r-lg);
      overflow: hidden; background: rgba(0,0,0,.3);
      border: 1px solid var(--border);
    }
    .cam-controls { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

    /* Manual input */
    .manual-hint {
      color: var(--txt-muted); font-size: 12px; margin-top: 8px;
    }

    /* Result card */
    .result-card {
      transition: border-color .3s, background .3s;
      min-height: 200px; display: flex; flex-direction: column; justify-content: center;
    }
    .result-card.ok  { border-color: var(--accent-ring); background: rgba(34,197,94,.07); }
    .result-card.bad { border-color: var(--danger-ring); background: var(--danger-dim); }

    .result-head { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
    .result-icon { font-size: 52px; line-height: 1; }
    .result-title { font-size: 26px; font-weight: 900; margin: 0; }
    .result-status-line { color: var(--txt-muted); font-size: 14px; }

    .result-kv { margin-top: 8px; font-size: 16px; }
    .result-kv b { color: var(--txt-muted); font-weight: 500; margin-right: 6px; }

    .result-detail {
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 14px; font-style: italic; color: var(--txt-muted);
    }

    /* Countdown bar */
    .countdown-wrap {
      margin-top: 16px; display: none;
    }
    .countdown-wrap.visible { display: block; }
    .countdown-bar-bg {
      height: 4px; border-radius: 2px; background: rgba(255,255,255,.08);
      overflow: hidden;
    }
    .countdown-bar {
      height: 100%; border-radius: 2px; background: var(--accent);
      transition: width 1s linear;
    }
    .countdown-label { font-size: 11px; color: var(--txt-muted); margin-top: 4px; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-brand">
    <div class="logo-badge">QR</div>
    <div>
      <div class="header-brand-title">Validar Acceso</div>
      <div class="header-brand-sub">Control de ingreso</div>
    </div>
  </div>
  <nav class="header-nav">
    <button class="btn btn-sm" id="themeToggle" onclick="toggleTheme()">Modo claro</button>
    <a href="/" class="btn btn-sm">← Volver</a>
  </nav>
</header>

<main class="page-main">
  <div class="scan-grid">

    <!-- Left: scanner panel -->
    <div class="card card-body">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('cam')">📷 Cámara QR</div>
        <div class="tab" onclick="switchTab('manual')">⌨️ Manual</div>
      </div>

      <div id="tabCam" class="tab-panel active">
        <div id="reader"></div>
        <div class="cam-controls">
          <button class="btn btn-primary" id="btnStart" onclick="startCam()">Iniciar cámara</button>
          <button class="btn d-none" id="btnStop" onclick="stopCam()">⏹ Detener</button>
        </div>
      </div>

      <div id="tabManual" class="tab-panel">
        <div class="form-group">
          <label class="form-label">Token del carnet (UUID)</label>
          <input id="manualToken" class="form-input" type="text"
                 placeholder="f259f193  ó  xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                 onkeypress="if(event.key==='Enter') validateManual()" />
        </div>
        <p class="manual-hint">Ingresá el código de 8 caracteres del carnet, el UUID completo, o la URL.</p>
        <button class="btn btn-primary btn-full mt" id="btnManual" onclick="validateManual()">
          Validar acceso
        </button>
      </div>
    </div>

    <!-- Right: result panel -->
    <div id="resultCard" class="card card-body result-card">
      <div class="result-head">
        <div id="rIcon" class="result-icon">⏳</div>
        <div>
          <div id="rTitle" class="result-title">Esperando…</div>
          <div id="rSub" class="result-status-line">Listo para procesar</div>
        </div>
      </div>
      <div id="rInfo"></div>
      <div id="cdWrap" class="countdown-wrap">
        <div class="countdown-bar-bg">
          <div id="cdBar" class="countdown-bar" style="width:100%"></div>
        </div>
        <div class="countdown-label" id="cdLabel"></div>
      </div>
    </div>

  </div>
</main>

<div id="toast-root"></div>
<script src="html5-qrcode.min.js"></script>
<script>
  initTheme();
  const API_URL = '/validar-qr';

  // Auto-validar si la URL trae ?token= (cuando se escanea el QR con el celular)
  (function() {
    const params = new URLSearchParams(window.location.search);
    const t = params.get('token');
    if (t) window.addEventListener('DOMContentLoaded', () => validate(t, true));
  })();
  const CLEAR_MS = 6000;

  const resultCard = document.getElementById('resultCard');
  const rIcon      = document.getElementById('rIcon');
  const rTitle     = document.getElementById('rTitle');
  const rSub       = document.getElementById('rSub');
  const rInfo      = document.getElementById('rInfo');
  const cdWrap     = document.getElementById('cdWrap');
  const cdBar      = document.getElementById('cdBar');
  const cdLabel    = document.getElementById('cdLabel');

  let qrScanner  = null;
  let lastToken  = null;
  let busy       = false;
  let clearTimer = null;
  let cdInterval = null;

  /* ── Audio feedback ── */
  function beep(ok) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = ok ? 'sine' : 'square';
      osc.frequency.setValueAtTime(ok ? 880 : 200, ctx.currentTime);
      gain.gain.setValueAtTime(.1, ctx.currentTime);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + (ok ? .5 : .8));
      osc.stop(ctx.currentTime + (ok ? .5 : .8));
    } catch(_) {}
  }

  /* ── UI state ── */
  function setResult(state, title, sub, infoHtml) {
    resultCard.className = 'card card-body result-card ' + (state || '');
    if (state === 'ok')  resultCard.classList.add('pulse-green');
    if (state === 'bad') resultCard.classList.add('pulse-red');
    setTimeout(() => { resultCard.classList.remove('pulse-green','pulse-red'); }, 600);

    rIcon.textContent  = state === 'ok' ? '✅' : (state === 'bad' ? '❌' : '⏳');
    rTitle.textContent = title;
    rSub.textContent   = sub || '';
    rInfo.innerHTML    = infoHtml || '';
  }

  function startCountdown(ms) {
    clearCountdown();
    cdWrap.classList.add('visible');
    const end = Date.now() + ms;
    cdBar.style.transition = 'none';
    cdBar.style.width = '100%';
    requestAnimationFrame(() => {
      cdBar.style.transition = `width ${ms}ms linear`;
      cdBar.style.width = '0%';
    });
    cdInterval = setInterval(() => {
      const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      cdLabel.textContent = left > 0 ? `Limpiando en ${left}s…` : '';
    }, 200);
  }

  function clearCountdown() {
    clearInterval(cdInterval);
    cdWrap.classList.remove('visible');
  }

  /* ── Token extraction ── */
  function extractToken(text) {
    const uuid = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
    const short = /^[0-9a-f]{8}$/i;
    const mUuid = text.match(uuid);
    if (mUuid) return mUuid[0];
    const trimmed = text.trim();
    if (short.test(trimmed)) return trimmed;
    return '';
  }

  /* ── Validation ── */
  async function validate(raw, manual = false) {
    const token = extractToken(raw);
    if (!token) return;
    if (token === lastToken && !manual) return;
    if (busy) return;

    busy = true; lastToken = token;
    clearTimeout(clearTimer);
    clearCountdown();
    setResult('', 'Validando…', `Token: ${token.slice(0,8)}…`, '');

    try {
      const res  = await fetch(`${API_URL}?token=${token}&_t=${Date.now()}`);

      let data;
      try {
        data = await res.json();
      } catch (_) {
        setResult('bad', 'ERROR', `Respuesta inválida del servidor (HTTP ${res.status})`, '');
        lastToken = null;
        busy = false;
        return;
      }

      if (!res.ok || !data.resultado) {
        setResult('bad', 'ERROR', `Error del servidor (HTTP ${res.status})`, '');
        lastToken = null;
        busy = false;
        return;
      }

      const estado = String(data.resultado).toUpperCase().trim();
      const ok = estado === 'OK';

      beep(ok);

      const labels = {
        OK: 'HABILITADO',
        VENCIDO: 'VENCIDO',
        ANULADO: 'ANULADO',
        TOKEN_INVALIDO: 'TOKEN INVÁLIDO',
        SUSPENDIDO: 'SUSPENDIDO',
        SIN_MEMBRESIA: 'SIN MEMBRESÍA'
      };

      const vencDisplay = Array.isArray(data.vencimiento)
        ? data.vencimiento.join('-')
        : (data.vencimiento || 'No indica');

      setResult(
        ok ? 'ok' : 'bad',
        labels[estado] || estado,
        ok ? 'Acceso autorizado' : 'Acceso denegado',
        `<div class="result-kv"><b>Socio:</b> ${data.nombre || 'Sin nombre'}</div>
         <div class="result-kv"><b>Vence:</b> ${vencDisplay}</div>
         ${data.detalle ? `<div class="result-detail">${data.detalle}</div>` : ''}`
      );

      startCountdown(CLEAR_MS);
      clearTimer = setTimeout(() => {
        setResult('', 'Esperando…', 'Listo para procesar', '');
        clearCountdown();
        lastToken = null;
      }, CLEAR_MS);

    } catch (_) {
      setResult('bad', 'ERROR', 'Falla de red o servidor no disponible', '');
      lastToken = null;
    } finally {
      busy = false;
    }
  }

  /* ── Camera ── */
  async function startCam() {
    if (!qrScanner) qrScanner = new Html5Qrcode('reader');
    try {
      await qrScanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 240 },
        text => validate(text));
      document.getElementById('btnStart').classList.add('d-none');
      document.getElementById('btnStop').classList.remove('d-none');
    } catch (_) {
      setResult('bad', 'Sin cámara', 'No se pudo acceder a la cámara', '');
    }
  }

  async function stopCam() {
    if (qrScanner) { try { await qrScanner.stop(); } catch(_){} }
    document.getElementById('btnStart').classList.remove('d-none');
    document.getElementById('btnStop').classList.add('d-none');
  }

  /* ── Manual ── */
  function validateManual() {
    const v = document.getElementById('manualToken').value.trim();
    if (!v) return;
    const token = extractToken(v);
    if (!token) {
      setResult('bad', 'Formato inválido',
        'El token debe ser un UUID (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)', '');
      return;
    }
    validate(v, true);
  }

  /* ── Tabs ── */
  function switchTab(id) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['cam','manual'][i] === id));
    document.getElementById('tabCam').classList.toggle('active', id === 'cam');
    document.getElementById('tabManual').classList.toggle('active', id === 'manual');
  }
</script>
</body>
</html>
