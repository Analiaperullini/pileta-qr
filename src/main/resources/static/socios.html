<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista de Socios — Club Pileta QR</title>
  <script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');})()</script>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
  <style>
    /* Filter bar */
    .filters {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--r-xl); padding: 18px 20px; margin-bottom: 20px;
      display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end;
    }
    @media (max-width: 700px) { .filters { grid-template-columns: 1fr; } }

    /* Table card */
    .table-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--r-xl); overflow: hidden;
    }

    /* Count badge in header */
    #countBadge { font-size: 13px; }

    /* Skeleton rows */
    .skel-row td { padding: 16px; }
    .skel-row .skeleton { height: 14px; }

    /* Empty */
    #emptyState { display: none; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-brand">
    <div class="logo-badge">👥</div>
    <div>
      <div class="header-brand-title">Lista de Socios</div>
      <div class="header-brand-sub">Panel administrativo</div>
    </div>
  </div>
  <nav class="header-nav">
    <span id="countBadge" class="badge badge-muted d-none"></span>
    <button class="btn btn-sm" id="themeToggle" onclick="toggleTheme()">Modo claro</button>
    <a href="/" class="btn btn-sm">← Volver</a>
  </nav>
</header>

<main class="page-main">

  <div class="filters">
    <div class="form-group">
      <label class="form-label">Nombre</label>
      <input id="fNombre" class="form-input" placeholder="Ej: Lionel…" oninput="filtrar()" />
    </div>
    <div class="form-group">
      <label class="form-label">DNI</label>
      <input id="fDni" class="form-input" placeholder="Ej: 35123456" oninput="filtrar()" inputmode="numeric" />
    </div>
    <div class="form-group">
      <label class="form-label">Deporte</label>
      <select id="fDeporte" class="form-select" onchange="filtrar()">
        <option value="">Todos los deportes</option>
      </select>
    </div>
    <button class="btn btn-danger" onclick="limpiarFiltros()">Limpiar</button>
  </div>

  <div class="table-card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Socio</th>
            <th>DNI · Contacto</th>
            <th>Deportes</th>
            <th style="text-align:right">Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaSocios">
          <!-- Skeleton -->
          <tr class="skel-row"><td><span class="skeleton" style="width:70%"></span></td><td><span class="skeleton" style="width:55%"></span></td><td><span class="skeleton" style="width:80%"></span></td><td></td></tr>
          <tr class="skel-row"><td><span class="skeleton" style="width:60%"></span></td><td><span class="skeleton" style="width:50%"></span></td><td><span class="skeleton" style="width:65%"></span></td><td></td></tr>
          <tr class="skel-row"><td><span class="skeleton" style="width:75%"></span></td><td><span class="skeleton" style="width:60%"></span></td><td><span class="skeleton" style="width:70%"></span></td><td></td></tr>
        </tbody>
      </table>
    </div>

    <div id="emptyState" class="empty-state">
      <span class="empty-icon">🔍</span>
      <div class="empty-title">Sin resultados</div>
      <p class="empty-desc">No hay socios que coincidan con los filtros aplicados.</p>
    </div>
  </div>

</main>

<script>
  initTheme();
  window.onload = async () => {
    const res = await fetch('/api/deportes');
    const deportes = await res.json();
    const sel = document.getElementById('fDeporte');
    deportes.forEach(d => {
      const o = document.createElement('option');
      o.value = d.id; o.textContent = `${d.nombre} (${d.categoria})`;
      sel.appendChild(o);
    });
    filtrar();
  };

  async function filtrar() {
    const n = document.getElementById('fNombre').value;
    const d = document.getElementById('fDni').value;
    const s = document.getElementById('fDeporte').value;

    const res    = await fetch(`/api/socios/filtrar?nombre=${encodeURIComponent(n)}&dni=${encodeURIComponent(d)}&deporteId=${s}`);
    const socios = await res.json();

    const tbody  = document.getElementById('tablaSocios');
    const empty  = document.getElementById('emptyState');
    const badge  = document.getElementById('countBadge');

    badge.textContent = `${socios.length} socio${socios.length !== 1 ? 's' : ''}`;
    badge.classList.remove('d-none');

    if (!socios.length) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    tbody.innerHTML = socios.map(s => `
      <tr>
        <td>
          <div class="fw-bold">${s.nombre}</div>
          <div class="text-muted text-xs">ID #${s.id}</div>
        </td>
        <td>
          <div>${s.dni}</div>
          <div class="text-muted text-xs">${s.email || 'Sin email'}</div>
        </td>
        <td>
          ${s.deportes.length
            ? s.deportes.map(dep => `<span class="badge badge-green" style="margin:2px 4px 2px 0">${dep.nombre}</span>`).join('')
            : '<span class="text-muted text-xs">Sin deportes</span>'
          }
        </td>
        <td style="text-align:right;">
          <a href="/carnet/socio/${s.id}" class="btn btn-sm btn-primary">Carnet</a>
        </td>
      </tr>
    `).join('');
  }

  function limpiarFiltros() {
    document.getElementById('fNombre').value = '';
    document.getElementById('fDni').value = '';
    document.getElementById('fDeporte').value = '';
    filtrar();
  }
</script>
</body>
</html>
