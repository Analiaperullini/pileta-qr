<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gestionar Deportes — Club Pileta QR</title>
  <script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');})()</script>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
  <style>
    .add-form {
      display: grid; grid-template-columns: 1fr 1fr auto; gap: 14px; align-items: end;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) { .add-form { grid-template-columns: 1fr; } }

    /* Confirm dialog */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: grid; place-items: center; z-index: 200;
      backdrop-filter: blur(4px);
      animation: _fadeUp .15s ease-out;
    }
    .dialog {
      background: var(--dialog-bg); border: 1px solid var(--border);
      border-radius: var(--r-xl); padding: 28px; max-width: 360px; width: 90%;
      box-shadow: var(--shadow);
    }
    .dialog h3 { margin: 0 0 8px; font-size: 18px; }
    .dialog p  { color: var(--txt-muted); font-size: 14px; margin: 0 0 22px; }
    .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }

    #emptyDeportes { display: none; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-brand">
    <div class="logo-badge">🏆</div>
    <div>
      <div class="header-brand-title">Deportes</div>
      <div class="header-brand-sub">Configuración de deportes y categorías</div>
    </div>
  </div>
  <nav class="header-nav">
    <button class="btn btn-sm" id="themeToggle" onclick="toggleTheme()">Modo claro</button>
    <a href="/" class="btn btn-sm">← Volver</a>
  </nav>
</header>

<main class="page-main">

  <div class="card card-body">
    <div class="add-form">
      <div class="form-group">
        <label class="form-label" for="nombreDep">Nombre del deporte</label>
        <input id="nombreDep" class="form-input" placeholder="Ej: Fútbol 11"
               onkeypress="if(event.key==='Enter') agregarDeporte()" />
      </div>
      <div class="form-group">
        <label class="form-label" for="catDep">Categoría / Edad</label>
        <input id="catDep" class="form-input" placeholder="Ej: Sub-17"
               onkeypress="if(event.key==='Enter') agregarDeporte()" />
      </div>
      <button class="btn btn-primary" id="btnAgregar" onclick="agregarDeporte()">+ Agregar</button>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Deporte</th>
            <th>Categoría</th>
            <th style="text-align:right">Acciones</th>
          </tr>
        </thead>
        <tbody id="listaDeportes"></tbody>
      </table>
    </div>

    <div id="emptyDeportes" class="empty-state">
      <span class="empty-icon">🏆</span>
      <div class="empty-title">Sin deportes aún</div>
      <p class="empty-desc">Creá el primer deporte usando el formulario de arriba.</p>
    </div>
  </div>

</main>

<!-- Confirm dialog -->
<div id="confirmOverlay" class="overlay d-none">
  <div class="dialog">
    <h3>¿Eliminar deporte?</h3>
    <p id="confirmMsg">Esta acción no se puede deshacer.</p>
    <div class="dialog-actions">
      <button class="btn" onclick="closeConfirm()">Cancelar</button>
      <button class="btn btn-danger" id="confirmOk">Eliminar</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script>
  initTheme();
  /* ── Toast ── */
  function toast(msg, type = 'ok', ms = 3500) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = `toast-item toast-${type}`;
    el.innerHTML = `<span>${type === 'ok' ? '✅' : '❌'}</span><span>${msg}</span>`;
    root.appendChild(el);
    setTimeout(() => {
      el.classList.add('toast-fade');
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }, ms);
  }

  /* ── Confirm dialog ── */
  let confirmCallback = null;
  function openConfirm(msg, cb) {
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmOverlay').classList.remove('d-none');
    confirmCallback = cb;
    document.getElementById('confirmOk').onclick = () => { closeConfirm(); cb(); };
  }
  function closeConfirm() {
    document.getElementById('confirmOverlay').classList.add('d-none');
    confirmCallback = null;
  }
  document.getElementById('confirmOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeConfirm();
  });

  /* ── Load ── */
  window.onload = listarDeportes;

  async function listarDeportes() {
    try {
      const res      = await fetch('/api/deportes');
      const deportes = await res.json();
      const tbody    = document.getElementById('listaDeportes');
      const empty    = document.getElementById('emptyDeportes');

      if (!deportes.length) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = deportes.map(d => `
        <tr>
          <td class="fw-bold">${d.nombre || 'Sin nombre'}</td>
          <td><span class="badge badge-green">${d.categoria || 'General'}</span></td>
          <td style="text-align:right">
            <button class="btn btn-sm btn-danger" onclick="pedirEliminar(${d.id}, '${(d.nombre || '').replace(/'/g,"\\'")}')">
              Eliminar
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      toast('Error al cargar deportes.', 'err');
    }
  }

  async function agregarDeporte() {
    const nombre    = document.getElementById('nombreDep').value.trim();
    const categoria = document.getElementById('catDep').value.trim();
    const btn       = document.getElementById('btnAgregar');

    if (!nombre) { toast('El nombre del deporte es obligatorio.', 'err'); return; }

    btn.classList.add('is-loading'); btn.disabled = true;

    try {
      const res = await fetch('/api/deportes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, categoria })
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);

      document.getElementById('nombreDep').value = '';
      document.getElementById('catDep').value = '';
      toast(`Deporte "${nombre}" agregado.`, 'ok');
      listarDeportes();
    } catch (e) {
      toast('Error al agregar el deporte.', 'err');
    } finally {
      btn.classList.remove('is-loading'); btn.disabled = false;
    }
  }

  function pedirEliminar(id, nombre) {
    openConfirm(`¿Eliminar el deporte "${nombre}"? Esta acción no se puede deshacer.`, () => eliminarDeporte(id, nombre));
  }

  async function eliminarDeporte(id, nombre) {
    try {
      const res = await fetch(`/api/deportes/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error();
      toast(`Deporte "${nombre}" eliminado.`, 'ok');
      listarDeportes();
    } catch (e) {
      toast('Error al eliminar el deporte.', 'err');
    }
  }
</script>
</body>
</html>
