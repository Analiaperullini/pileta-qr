<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar sesión — Club Pileta QR</title>
  <script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');})()</script>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
  <style>
    body { display: grid; place-items: center; padding: var(--p); }

    .login-card {
      width: min(420px, 100%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 32px;
      box-shadow: var(--shadow);
      animation: _fadeUp .35s ease-out both;
    }

    .login-logo {
      display: flex; align-items: center; gap: 14px; margin-bottom: 28px;
    }
    .login-logo-badge {
      width: 48px; height: 48px; border-radius: 16px; flex-shrink: 0;
      display: grid; place-items: center;
      background: var(--accent-dim); border: 1px solid var(--accent-ring);
      font-weight: 900; font-size: 14px; color: var(--accent-txt);
    }
    .login-logo h1 { margin: 0; font-size: 20px; }
    .login-logo p  { color: var(--txt-muted); font-size: 13px; margin-top: 3px; }

    .field-wrap { margin-top: 18px; display: grid; gap: 6px; }

    .error-banner {
      display: none; margin-top: 16px;
      padding: 11px 14px; border-radius: var(--r);
      background: var(--danger-dim); border: 1px solid var(--danger-ring);
      color: var(--danger-txt); font-size: 13px;
      align-items: center; gap: 8px;
      animation: _fadeUp .2s ease-out;
    }
    .error-banner.visible { display: flex; }

    .btn-submit { margin-top: 22px; }

    .login-footer {
      margin-top: 20px; text-align: center;
      color: var(--txt-muted); font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-badge">QR</div>
      <div>
        <h1>Club Pileta</h1>
        <p>Sistema de Carnets y Control de Acceso</p>
      </div>
    </div>

    <form method="post" action="/login" id="loginForm">
      <div class="field-wrap">
        <label class="form-label" for="username">Usuario</label>
        <input class="form-input" id="username" name="username"
               placeholder="admin" autocomplete="username" autofocus />
      </div>

      <div class="field-wrap">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-input" id="password" name="password"
               type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div id="errorBanner" class="error-banner">
        <span>⚠️</span>
        <span>Usuario o contraseña incorrectos. Intentá de nuevo.</span>
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-primary btn-lg btn-full btn-submit">
        Ingresar
      </button>
    </form>

    <div class="login-footer">
      Club Pileta QR &nbsp;·&nbsp; Sistema de gestión
      <div style="margin-top:10px">
        <button class="btn btn-sm" id="themeToggle" onclick="toggleTheme()">Modo claro</button>
      </div>
    </div>
  </div>

  <script>
    initTheme();
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('errorBanner').classList.add('visible');
    }

    document.getElementById('loginForm').addEventListener('submit', function() {
      const btn = document.getElementById('btnSubmit');
      btn.classList.add('is-loading');
      btn.textContent = 'Ingresando';
      btn.disabled = true;
    });
  </script>
</body>
</html>
