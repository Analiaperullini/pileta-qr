<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panel de Control — Club Pileta QR</title>
  <script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');})()</script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .quick-search {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
    }
    .quick-search h2 { margin: 0 0 4px; font-size: 16px; }

    .search-row { display: flex; gap: 10px; margin-top: 14px; }
    .search-row .form-input { flex: 1; font-size: 16px; }
    @media (max-width: 480px) { .search-row { flex-direction: column; } }

    /* Search result */
    .search-result {
      margin-top: 16px; padding: 16px; border-radius: var(--r-lg);
      background: rgba(34,197,94,.07); border: 1px solid var(--accent-ring);
      display: none; justify-content: space-between; align-items: flex-start; gap: 16px;
      animation: _fadeUp .2s ease-out;
    }
    .search-result.visible { display: flex; }
    .search-result-name { font-size: 19px; font-weight: 700; color: var(--accent-txt); }
    .search-result-sub  { color: var(--txt-muted); font-size: 13px; margin-top: 3px; }
    .search-result-sports { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }

    .search-msg { margin-top: 10px; font-size: 13px; color: var(--danger); min-height: 18px; }

    /* Nav cards */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .nav-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--r-xl); padding: 22px;
      cursor: pointer; text-decoration: none; color: var(--txt);
      transition: border-color .2s, transform .18s, box-shadow .18s;
      display: flex; flex-direction: column; gap: 8px;
    }
    .nav-card:hover {
      border-color: var(--accent-ring);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,.3);
    }
    .nav-card:active { transform: translateY(-1px); }
    .nav-card-icon {
      width: 44px; height: 44px; border-radius: var(--r-md);
      display: grid; place-items: center; font-size: 22px;
      background: rgba(255,255,255,.06); border: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .nav-card h2 { margin: 0; font-size: 17px; }
    .nav-card p  { margin: 0; color: var(--txt-muted); font-size: 13px; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-brand">
    <div class="logo-badge">QR</div>
    <div>
      <div class="header-brand-title">Club Pileta</div>
      <div class="header-brand-sub">Panel de Control</div>
    </div>
  </div>
  <nav class="header-nav">
    <button class="btn btn-sm" id="themeToggle" onclick="toggleTheme()">Modo claro</button>
    <button class="btn btn-sm" onclick="logout()">Cerrar sesión</button>
  </nav>
</header>

<main class="page-main">

  <section class="quick-search">
    <h2>Acceso rápido</h2>
    <p class="text-muted text-sm">Buscá un socio por DNI para ver su carnet.</p>

    <div class="search-row">
      <input id="dniBuscar" class="form-input" type="text"
             placeholder="Ingresá el DNI…" inputmode="numeric"
             onkeypress="if(event.key==='Enter') buscarSocio()" />
      <button class="btn btn-primary" id="btnBuscar" onclick="buscarSocio()">Buscar</button>
    </div>

    <div id="resultado" class="search-result">
      <div>
        <div id="rNombre" class="search-result-name"></div>
        <div id="rInfo" class="search-result-sub"></div>
        <div id="rDeportes" class="search-result-sports"></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="abrirCarnet()">Ver carnet →</button>
    </div>

    <div id="msg" class="search-msg"></div>
  </section>

  <div class="nav-grid">
    <a href="/scan.html" class="nav-card">
      <div class="nav-card-icon">✅</div>
      <h2>Validar Acceso</h2>
      <p>Escanear QR en la entrada.</p>
    </a>

    <a href="/alta-socio.html" class="nav-card">
      <div class="nav-card-icon">➕</div>
      <h2>Alta de Socio</h2>
      <p>Registrar nuevo socio.</p>
    </a>

    <a href="/admin-deportes.html" class="nav-card">
      <div class="nav-card-icon">🏆</div>
      <h2>Gestionar Deportes</h2>
      <p>Crear deportes y categorías.</p>
    </a>

    <a href="/socios.html" class="nav-card">
      <div class="nav-card-icon">👥</div>
      <h2>Lista de Socios</h2>
      <p>Ver y editar todos los socios.</p>
    </a>
  </div>

</main>

<script src="auth.js"></script>
<script>
initTheme();
let socioActual = null;

async function buscarSocio() {
  const q = document.getElementById('dniBuscar').value.trim();
  const msg = document.getElementById('msg');
  const resDiv = document.getElementById('resultado');
  const depDiv = document.getElementById('rDeportes');
  const btn = document.getElementById('btnBuscar');

  msg.textContent = '';
  resDiv.classList.remove('visible');
  depDiv.innerHTML = '';
  socioActual = null;

  if (!q) return;

  btn.classList.add('is-loading');
  btn.disabled = true;

  try {
    const r = await fetch(`/api/socios/buscar?q=${encodeURIComponent(q)}`);
    if (!r.ok) { msg.textContent = 'Socio no encontrado.'; return; }

    const socio = await r.json();
    if (socio && socio.id) {
      socioActual = socio;
      document.getElementById('rNombre').textContent = socio.nombre;
      document.getElementById('rInfo').textContent = `DNI: ${socio.dni}  ·  ID #${socio.id}`;

      if (socio.deportes && socio.deportes.length > 0) {
        depDiv.innerHTML = socio.deportes
          .map(d => `<span class="badge badge-green">${d.nombre} · ${d.categoria}</span>`)
          .join('');
      } else {
        depDiv.innerHTML = '<span class="text-muted text-sm">Sin deportes asignados</span>';
      }
      resDiv.classList.add('visible');
    }
  } catch (e) {
    msg.textContent = 'Error de conexión con el servidor.';
  } finally {
    btn.classList.remove('is-loading');
    btn.disabled = false;
  }
}

function abrirCarnet() {
  if (socioActual) window.location.href = '/carnet/socio/' + socioActual.id;
}
</script>
</body>
</html>
